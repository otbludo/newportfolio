<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Inter, Arial, Helvetica, sans-serif">
  <title>Pipeline KYC : document d'identité analysé par OCR puis validé</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3a"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="960" height="400" fill="url(#bg)"/>
  <rect width="960" height="400" fill="url(#grid)"/>

  <!-- 1. Document -->
  <g transform="translate(36 95) scale(1.4)">
    <rect width="240" height="150" rx="12" fill="#f8fafc"/>
    <rect width="240" height="30" rx="12" fill="#1e3a5f"/>
    <rect y="18" width="240" height="12" fill="#1e3a5f"/>
    <text x="14" y="20" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5">CARTE D'IDENTITÉ</text>
    <rect x="14" y="44" width="62" height="78" rx="6" fill="#cbd5e1"/>
    <circle cx="45" cy="72" r="13" fill="#94a3b8"/>
    <path d="M23 118c3-16 12-23 22-23s19 7 22 23z" fill="#94a3b8"/>
    <rect x="90" y="48" width="70" height="8" rx="4" fill="#94a3b8"/>
    <rect x="90" y="64" width="120" height="8" rx="4" fill="#475569"/>
    <rect x="90" y="84" width="54" height="8" rx="4" fill="#94a3b8"/>
    <rect x="90" y="100" width="96" height="8" rx="4" fill="#475569"/>
    <rect x="14" y="132" width="212" height="7" rx="3.5" fill="#cbd5e1"/>
    <g fill="none" stroke="#10b981" stroke-width="2">
      <rect x="10" y="40" width="70" height="86" rx="4"/>
      <rect x="86" y="60" width="128" height="16" rx="3"/>
      <rect x="86" y="96" width="104" height="16" rx="3"/>
      <rect x="10" y="128" width="220" height="15" rx="3"/>
    </g>
    <rect x="0" y="70" width="240" height="40" fill="url(#scan)"/>
    <rect x="0" y="109" width="240" height="2" fill="#34d399"/>
  </g>

  <!-- flèche -->
  <path d="M398 200h40" stroke="#34d399" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M432 190l12 10-12 10" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Extraction -->
  <g transform="translate(462 95) scale(1.4)">
    <rect width="240" height="150" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <g font-size="12">
      <text x="16" y="32" fill="#94a3b8">nom</text>
      <rect x="92" y="22" width="96" height="12" rx="6" fill="#e2e8f0"/>
      <text x="16" y="64" fill="#94a3b8">naissance</text>
      <rect x="92" y="54" width="70" height="12" rx="6" fill="#e2e8f0"/>
      <text x="16" y="96" fill="#94a3b8">numéro</text>
      <rect x="92" y="86" width="108" height="12" rx="6" fill="#e2e8f0"/>
      <text x="16" y="128" fill="#94a3b8">expiration</text>
      <rect x="92" y="118" width="70" height="12" rx="6" fill="#e2e8f0"/>
    </g>
    <g fill="#10b981">
      <circle cx="218" cy="28" r="7"/><circle cx="218" cy="60" r="7"/>
      <circle cx="218" cy="92" r="7"/><circle cx="218" cy="124" r="7"/>
    </g>
    <g fill="none" stroke="#0b1220" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M214.5 28l2.5 2.5 4.5-5"/><path d="M214.5 60l2.5 2.5 4.5-5"/>
      <path d="M214.5 92l2.5 2.5 4.5-5"/><path d="M214.5 124l2.5 2.5 4.5-5"/>
    </g>
  </g>

  <!-- 3. Validation -->
  <g transform="translate(810 186)">
    <circle cx="70" cy="14" r="46" fill="#10b981"/>
    <path d="M50 14l14 14 26-28" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
