    <text x="1291" y="227">time-steps = 32</text>

    <rect x="1026" y="315" width="140" height="46" rx="12" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1096" y="334">chars = 80</text>
    <text x="1096" y="353">time-steps = 32</text>

    <rect x="1640" y="104" width="114" height="46" rx="12" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1697" y="123">longueur ≤ 32</text>
    <text x="1697" y="142">« house »</text>

    <rect x="1457" y="297" width="114" height="46" rx="12" fill="#ffffff" stroke="#94a3b8"/>
    <text x="1514" y="316">longueur ≤ 32</text>
    <text x="1514" y="335">« house »</text>
  </g>
</svg>
